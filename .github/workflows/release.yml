name: Tag-Driven Automated Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update module.json Version and Download URL
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.TAG_NAME;
            const repo = process.env.REPO;
            const version = tag.replace(/^v/, '');
            const m = JSON.parse(fs.readFileSync('module.json'));

            m.version = version;
            m.manifest = \`https://github.com/\${repo}/releases/latest/download/module.json\`;
            m.download = \`https://github.com/\${repo}/releases/download/\${tag}/module.zip\`;

            fs.writeFileSync('module.json', JSON.stringify(m, null, 2));
            console.log(\`module.json actualizado automáticamente a v\${version}\`);
          "

      - name: Create Zip Package
        run: |
          zip -r ./module.zip . -x "*.git*" "*.github*" "*.LOCK" ".gitignore" ".gitattributes"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}