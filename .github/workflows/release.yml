name: 100% Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Bump Version and Update module.json
        run: |
          # Obtener el último tag o usar v0.1.0 si no existe ninguno
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")

          # Extraer Major, Minor y Patch
          RAW_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VERSION"

          # Incrementar automáticamente el Patch (ej. 0.1.0 -> 0.1.1)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "TAG_NAME=$NEW_TAG" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Actualizar module.json en caliente
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('module.json'));
            m.version = '$NEW_VERSION';
            m.download = \`https://github.com/\${process.env.GITHUB_REPOSITORY}/releases/download/$NEW_TAG/module.zip\`;
            fs.writeFileSync('module.json', JSON.stringify(m, null, 2));
          "

      - name: Create Zip Package
        run: |
          zip -r ./module.zip . -x "*.git*" "*.github*" "*.LOCK" ".gitignore" ".gitattributes"

      - name: Publish Release & Tag Automatically
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            module.json
            module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}